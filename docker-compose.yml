name: webui-mcp-server
services:
  # MCPO Gateway - MCP to OpenAPI proxy
  mcpo:
    build:
      context: ./mcpo
      dockerfile: Dockerfile
    container_name: mcpo-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./mcpo/config.json:/app/config/config.json:ro
      - ./mcpo/data:/app/data
    environment:
      - MCPO_API_KEY=abracadabra
      - DISPLAY=:99
    restart: unless-stopped
    networks:
      - mcp-network
    shm_size: 2gb
  # Ollama Open WebUI
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:ollama
    container_name: ollama-webui
    ports:
      - "3000:8080"
      - "11434:11434" # FIX: Expose Ollama's internal port to the network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Tus modelos ya descargados — montados directamente
      - C:\Users\EdO\.ollama:/root/.ollama
      # Datos de Open WebUI (chats, usuarios, configuración)
      # - open-webui-data:/app/backend/data
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0
      - WEBUI_SECRET_KEY=abracadabra
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]  
    networks:
      - mcp-network
  # ── 2. OpenClaw ─────────────────────────────────────────
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    ports:
      - "18789:18789"     # Dashboard de OpenClaw
    volumes:
      - C:\Users\EdO\.openclaw:/home/node/.openclaw
      - C:\Users\EdO\openclaw-workspace:/home/node/workspace
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama-webui:11434  # apunta al container de Ollama
      - OPENCLAW_GATEWAY_MODE=local
      - OPENCLAW_GATEWAY_TOKEN=abracadabra
    networks:
      - mcp-network
  # ── 3. Hermes Agent ─────────────────────────────────────
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    command: gateway run
    ports:
      - "8642:9119"       
    volumes:
      - C:\Users\EdO\.hermes:/opt/data
    restart: unless-stopped
    environment:
      # FIX 1: Explicitly force local custom provider engine
      - HERMES_INFERENCE_PROVIDER=custom
      
      # FIX 2: Correct the endpoint with the mandatory /v1 suffix
      - HERMES_API_BASE_URL=http://ollama-webui:11434/v1
      
      # FIX 3: Assign your security token explicitly for the LLM requests
      #- HERMES_API_KEY=
      
      # Keep your existing Web UI dashboard settings below
      - HERMES_DASHBOARD=1
      - GATEWAY_ALLOW_ALL_USERS=true
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0      
      - API_SERVER_KEY=abracadabra 
    networks:
      - mcp-network

#volumes:
#  open-webui-data:  
networks:
  mcp-network:
    name: mcp-network
    driver: bridge