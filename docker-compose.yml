name: webui-mcp-server
services:
  # MCPO Gateway - MCP to OpenAPI proxy
  mcpo:
    build:
      context: ./mcpo
      dockerfile: Dockerfile
    container_name: mcpo-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./mcpo/config.json:/app/config/config.json:ro
      - ./mcpo/data:/app/data
    environment:
      - MCPO_API_KEY=abracadabra
      - DISPLAY=:99
    restart: unless-stopped
    networks:
      - mcp-network
    shm_size: 2gb
  # Ollama Open WebUI
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:ollama
    container_name: ollama-webui
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Tus modelos ya descargados — montados directamente
      - C:\Users\EdO\.ollama:/root/.ollama
      # Datos de Open WebUI (chats, usuarios, configuración)
      # - open-webui-data:/app/backend/data
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0
      - WEBUI_SECRET_KEY=abracadabra
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
#volumes:
#  open-webui-data:    
    networks:
      - mcp-network

networks:
  mcp-network:
    name: mcp-network
    driver: bridge