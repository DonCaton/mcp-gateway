name: webui-mcp-server
services:
  # MCPO Gateway - MCP to OpenAPI proxy
  mcpo:
    build:
      context: ./mcpo
      dockerfile: Dockerfile
    container_name: mcpo-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./mcpo/config.json:/app/config/config.json:ro
      - mcpo-data:/app/data
    environment:
      - MCPO_API_KEY=abracadabra
      - DISPLAY=:99
    restart: unless-stopped
    networks:
      - mcp-network
    shm_size: 2gb

  # Open WebUI
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - mcp-network

volumes:
  mcpo-data:
  open-webui:

networks:
  mcp-network:
    name: mcp-network
    driver: bridge