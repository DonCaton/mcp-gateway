name: webui-mcp-server
services:
  # MCPO Gateway - MCP to OpenAPI proxy
  mcpo:
    build:
      context: ./mcpo
      dockerfile: Dockerfile
    container_name: mcpo-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./mcpo/config.json:/app/config/config.json:ro
      - ./mcpo/data:/app/data
    environment:
      - MCPO_API_KEY=abracadabra
      - DISPLAY=:99
    restart: unless-stopped
    networks:
      - mcp-network
    shm_size: 2gb
  # Ollama Open WebUI
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:ollama
    container_name: ollama-webui
    ports:
      - "3000:8080"
      - "11434:11434" # FIX: Expose Ollama's internal port to the network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Tus modelos ya descargados — montados directamente
      - C:\Users\EdO\.ollama:/root/.ollama
      # Datos de Open WebUI (chats, usuarios, configuración)
      - D:\Development\LLM-LAB\ollama-stack\open-webui-data:/app/backend/data
    restart: always
    environment:
      - OLLAMA_HOST=0.0.0.0
      - WEBUI_SECRET_KEY=abracadabra
      - CUDA_VISIBLE_DEVICES=1,0   # ← Titan RTX (bus GPU1) pasa a ser CUDA device 0
      - OLLAMA_CONTEXT_WINDOW=98304
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]  
    networks:
      - mcp-network
  # ── 2. OpenClaw ─────────────────────────────────────────
  openclaw:
    build:
      context: ./openclaw
      dockerfile: Dockerfile
    container_name: openclaw
    command: openclaw gateway run      # Run
    ports:
      - "18789:18789"     # Dashboard de OpenClaw
      - "8086:8086"     # API de OpenClaw (lo que el MCP Gateway va a consumir)
    volumes:
      - C:\Users\EdO\.openclaw:/home/node/.openclaw
      - C:\Users\EdO\openclaw-workspace:/home/node/.openclaw/workspace
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434  # apunta al container de Ollama
      - OPENCLAW_GATEWAY_MODE=local
      - OPENCLAW_GATEWAY_TOKEN=abracadabra
      - OPENCLAW_BROWSER_HEADLESS=1
      - OPENCLAW_BROWSER_NO_SANDBOX=1
      - TELEGRAM_BOT_TOKEN=8972872485:AAH5Pu9wnoN0gBUZNJ3EKzqDMzE1Om5gl5g
      - PUPPETEER_SKIP_DOWNLOAD=1 # Skip downloading bundled Chromium
    networks:
      - mcp-network
    shm_size: 2gb # Required for Chromium headless operation
  # ── 3. Hermes Agent ─────────────────────────────────────
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    command: gateway run
    ports:
      - "9119:9119"       # Dashboard UI (Admin panel)
      - "8642:8642"       # Platform API / OpenAI server (What WebUI talks to)
    volumes:
      - C:\Users\EdO\.hermes:/opt/data
      #- /var/run/docker.sock:/var/run/docker.sock # ← CRITICAL: Adds host Docker control
    restart: unless-stopped
    environment:
      # FIX 1: Explicitly force local custom provider engine
      - HERMES_INFERENCE_PROVIDER=custom
      # FIX 2: Correct the endpoint with the mandatory /v1 suffix
      - HERMES_API_BASE_URL=http://ollama-webui:11434/v1
      # FIX 3: Assign your security token explicitly for the LLM requests
      - HERMES_API_KEY=abracadabra
      # FIX 4: Ensure session management is enabled
      - HERMES_SESSIONS_ENABLED=true
      # FIX 5: Ensure proper session handling
      - HERMES_SESSIONS_AUTO_CREATE=true
      # Keep your existing Web UI dashboard settings below
      - HERMES_DASHBOARD=1
      - GATEWAY_ALLOW_ALL_USERS=true
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=abracadabra
      # FIX: Allow the dashboard to communicate with the API without cross-origin blocks
      - API_SERVER_CORS_ORIGINS=*
    networks:
      - mcp-network
  # ── 4. Generar Imagenes SDXL-TURBO
  sdxl-turbo:
    build:
      context: ./sdxl-turbo
      dockerfile: Dockerfile
    container_name: sdxl-turbo
    ports:
      - "7860:7860"
    volumes:
      - D:\Development\LLM-LAB\ollama-stack\hf-cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - mcp-network
    restart: unless-stopped
#volumes:
#  open-webui-data:  
networks:
  mcp-network:
    name: mcp-network
    driver: bridge